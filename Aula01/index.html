<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula 1 - CSS </title>

    <style>

        h4.centralizado{
            text-align: center;
            color: crimson;
        }

        *{
            font-family:Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Introdução ao CSS</h1>

    <h3 style="font-family: sans-serif; background-color: cornflowerblue;">Exemplo simples de CSS</h3>

    <p style="font-family: monospace; background-color: cadetblue;">Eu sou um parágrafo</p>

    <hr>

    <h3>Exemplo de estilo em um elemento que faz parte de uma classe</h3>

    <h4 class="centralizado">Eu sou um h4</h4>

    <p class="centralizado">Eu sou um parágrafo</p>

    <hr>

    <h3>Definindo estilos com o seletor global *</h3>

    <p>Todos os elementos textuais terão a mesma fonte, inclusive este paragrafo</p>
    
</body>
</html>
