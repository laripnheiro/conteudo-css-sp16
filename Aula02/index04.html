<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>

    <h1>Margin no CSS</h1>

    <h3>Definindo margens individuais</h3>

    <p class="margin-ex1">Esqueceu-se de inventar o perdão</p>
    
    <hr>

    <h3>Definindo margens com propriedade abreviada</h3>

    <p class="margin-ex2">Apesar de você</p>
    
    <p class="margin-ex3">Amanhã há de ser</p>
    
    <p class="margin-ex4">Outro dia</p>
    
    <p class="margin-ex5">Eu pergunto a você</p>
    
    

    <hr>
